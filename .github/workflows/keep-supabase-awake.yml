# ===================================================================
#  ปลุก Supabase ไม่ให้ถูกพัก
#
#  แพ็กเกจฟรีพักโปรเจกต์ที่ไม่มีการใช้งานเกิน 7 วัน
#  พอถูกพัก หน้าสั่งซื้อกับแอปหลังบ้านล่มทันที ลูกค้าเจอ error เงียบ ๆ
#  งานนี้ยิงคำขอเบา ๆ ทุก 3 วัน ให้นับว่ายังมีการใช้งานอยู่
#
#  ไม่ต้องตั้ง secret ใด ๆ - คีย์ด้านล่างเป็น publishable key
#  ที่เปิดเผยอยู่แล้วในหน้าสั่งซื้อ (order.html) และอ่านตาราง orders ไม่ได้
#  เพราะ Row Level Security กันไว้ ตรวจสอบแล้วว่าได้ HTTP 401
# ===================================================================
name: ปลุก Supabase

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ยิงคำขอไปที่ Supabase
        env:
          URL: https://klgtxupwfsbyraoiyhhs.supabase.co
          KEY: sb_publishable_oucf4DJN_W_0aHYB3RoMvQ_64lkwFLe
        run: |
          code=0
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -m 30 \
              "$URL/rest/v1/products?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Supabase ตื่นอยู่ (ครั้งที่ $attempt)"
              exit 0
            fi
            echo "ครั้งที่ $attempt ได้ HTTP $code - รออีก 30 วินาที"
            sleep 30
          done
          echo "::error::ปลุกไม่ขึ้น ครั้งสุดท้ายได้ HTTP $code"
          cat /tmp/out.txt || true
          exit 1
